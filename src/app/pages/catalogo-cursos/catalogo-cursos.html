<div class="page-heading"><div><span class="eyebrow">OFERTA ACADÉMICA</span><h1>Cursos de sexto semestre</h1><p>Selecciona una materia para conocer sus contenidos y objetivos.</p></div><span class="count-chip">{{ cursos.length }} cursos</span></div>
<div class="course-grid">@for (curso of cursos; track curso.id) {<button class="course-card course-card-trigger" type="button" [class.course-card-selected]="cursoSeleccionado() === curso.id" [attr.aria-expanded]="cursoSeleccionado() === curso.id" (click)="alternarDescripcion(curso)"><span class="course-card-top"><span class="course-symbol"><mat-icon>auto_stories</mat-icon></span><span class="credit-badge">{{ curso.semestre }}</span></span><span class="eyebrow">{{ curso.codigo }}</span><strong class="course-card-title">{{ curso.nombre }}</strong><span class="course-card-career">{{ nombreCarrera(curso.carreraId) }}</span>@if (cursoSeleccionado() === curso.id) {<span class="course-description"><span class="course-description-heading"><mat-icon>menu_book</mat-icon> ¿De qué trata?</span>{{ curso.descripcion }}</span>}<span class="course-card-footer"><span>{{ cursoSeleccionado() === curso.id ? 'Ocultar descripción' : 'Ver descripción' }}</span><mat-icon>{{ cursoSeleccionado() === curso.id ? 'expand_less' : 'expand_more' }}</mat-icon></span></button>}</div>
